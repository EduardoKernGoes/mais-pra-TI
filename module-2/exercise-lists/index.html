<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Eduardo Goes</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
        <link rel="stylesheet" href="./styles/index.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="./components/header.js" defer></script>
        <script src="./components/footer.js" defer></script>
    </head>
    <body>
        
        <section class="main-section mb-5">
            <site-header></site-header>
            <div class="container d-md-flex py-5 gap-5 align-items-center">
                <div>
                    <div class="text-center mt-3">
                        <h1 class="main-title m-0 p-0 display-3">Full-stack <br class="d-none d-md-block"> Developer</h1>
                        <p class="fs-4">
                            Linguagens
                        </p>
                    </div>
                    <div class="linguages">
                        <i class="devicon-html5-plain colored"></i>
                        <i class="devicon-css3-plain colored"></i>
                        <i class="devicon-javascript-plain colored"></i>
                        <i class="devicon-java-plain colored"></i>
                        
                        <i class="devicon-python-plain colored"></i>
                        <i class="devicon-flutter-plain colored"></i>
                        <i class="devicon-mysql-plain colored"></i>
                        <i class="devicon-php-plain colored"></i>
                        <i class="devicon-postgresql-plain colored"></i>
                        <i class="devicon-github-plain colored"></i>
                        <i class="devicon-git-plain colored"></i>
                    </div>
                </div>
                <div class="index-image d-none d-md-block">
                    <img class="w-100 h-100 object-fit-cover" src="./assets/images/me-index.jpeg">
                </div>
            </div>
        </section>
        <main class="container">
            <div class="container mt-5">
                <div class="row">
                    <div class="col-md-6 col-lg-4 text-center">
                        <div class="card shadow-sm p-4">
                            <h3 class="mb-3">Meu GitHub</h3>
                            
                            <p class="fs-5">Total de Projetos: <strong id="total-projetos">Carregando...</strong></p>
                            
                            <div style="position: relative; height:250px; width:100%">
                                <canvas id="githubChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div id="list-projects" class="col-md-6 col-lg-4 text-center">
                    </div>
                </div>
            </div>
        </main>
        <site-footer></site-footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./js/index.js"></script>
    </body>
</html>
